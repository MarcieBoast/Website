<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body


    .audio-control {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
    }


    .audio-btn {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .audio-btn:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    /* Simple layout centering content */
    .portfolio-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Autoplay muted by default to satisfy browser safety compliance -->
  <audio id="bgAudio" src="/assets/portalradio.mp3" loop autoplay muted></audio>

  <!-- Control Button Overlay -->
  <div class="audio-control">
    <button class="audio-btn" id="audioToggle">
      <span id="audioIcon">█</span> <span id="audioText">SOUND OFF</span>
    </button>
  <script>
    const audio = document.getElementById('bgAudio');
    const toggleBtn = document.getElementById('audioToggle');
    const audioIcon = document.getElementById('audioIcon');
    const audioText = document.getElementById('audioText');

    // Keep background ambiance pleasant and low-key
    audio.volume = 0.25;

    toggleBtn.addEventListener('click', () => {
      // Toggle the native muted state
      audio.muted = !audio.muted;

      // Update button text and icons to match state
      if (audio.muted) {
        audioIcon.innerText = "█";
        audioText.innerText = "SOUND OFF";
      } else {
        audioIcon.innerText = "■";
        audioText.innerText = "SOUND ON";
        
        // Safety check: force play in case the browser blocked initial autoplay entirely
        audio.play().catch(err => console.log("Playback error: ", err));
      }
    });
  </script>
</body>
</html>
